name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: client pick
        run: node scripts/pick-npc-test.js
      - name: client sprites
        run: node scripts/sprites-test.js
      - name: build
        run: go build -o /tmp/world ./cmd/world && go build -o /tmp/bots ./cmd/bots

  # Store tests need real Postgres and Redis; they skip without these URLs.
  store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hollowmere
          POSTGRES_PASSWORD: hollowmere
          POSTGRES_DB: hollowmere_test
        options: >-
          --health-cmd "pg_isready -U hollowmere -d hollowmere_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: store integration tests
        env:
          HOLLOWMERE_TEST_DATABASE_URL: postgres://hollowmere:hollowmere@127.0.0.1:5432/hollowmere_test?sslmode=disable
          HOLLOWMERE_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: go test -race -count=1 ./internal/store/...
