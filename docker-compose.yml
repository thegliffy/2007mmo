# One world process + canonical Postgres + Redis session/presence.
# T4: docker compose up --build  then open http://127.0.0.1:8080
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hollowmere
      POSTGRES_PASSWORD: hollowmere
      POSTGRES_DB: hollowmere
    # Loopback only. The world reaches Postgres over the compose network;
    # publishing on 0.0.0.0 put a hollowmere/hollowmere database on the
    # internet of whatever host this runs on.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hollowmere -d hollowmere"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Loopback only: Redis has no password and now holds login sessions.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  world:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      DATABASE_URL: postgres://hollowmere:hollowmere@postgres:5432/hollowmere?sslmode=disable
      REDIS_URL: redis://redis:6379
      TICK_MS: "600"
      HTTP_ADDR: ":8080"
      TLS_ADDR: ":8443"
      WEB_DIR: /app/web
      # Generous local defaults. Tighten on 2007.gliffy.tv — see docs/ops.md A4.
      HOLLOWMERE_LIMIT_HELLO_RATE: "12"
      HOLLOWMERE_LIMIT_HELLO_BURST: "40"
      HOLLOWMERE_LIMIT_CONN_RATE: "20"
      HOLLOWMERE_LIMIT_CONN_BURST: "80"
      HOLLOWMERE_LIMIT_WS_RATE: "20"
      HOLLOWMERE_LIMIT_WS_BURST: "32"
      HOLLOWMERE_LIMIT_CHAT_RATE: "0.8"
      HOLLOWMERE_LIMIT_CHAT_BURST: "4"
      # Login budget. Generous here so the 200-bot harness can sign in;
      # docs/ops.md A5 has the far tighter live values.
      HOLLOWMERE_LIMIT_LOGIN_RATE: "60"
      HOLLOWMERE_LIMIT_LOGIN_BURST: "400"
      HOLLOWMERE_LIMIT_LOGIN_USER_RATE: "10"
      HOLLOWMERE_LIMIT_LOGIN_USER_BURST: "20"
      # Reverse-proxy trust. Unset here because nothing fronts the local
      # stack; on 2007.gliffy.tv Caddy does, and all three are required —
      # see docs/ops.md A4. Without TRUSTED_PROXIES every player shares one
      # login budget AND the session cookie never gets Secure.
      #   HOLLOWMERE_TRUSTED_PROXIES: "172.16.2.1/32,127.0.0.1/32"  # compose bridge gateway
      #   HOLLOWMERE_ALLOWED_ORIGINS: "2007.gliffy.tv"
      #   HOLLOWMERE_SECURE_COOKIES: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  bots:
    profiles: ["load"]
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/bots"]
    command: ["-n", "200", "-hotspot", "-addr", "ws://world:8080/ws", "-stats", "http://world:8080/stats", "-duration", "45s"]
    depends_on:
      world:
        condition: service_healthy

volumes:
  pgdata:
